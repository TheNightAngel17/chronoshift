name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          awk -v ver="[$GITHUB_REF_NAME]" '
            state==0 && /^## / {
              if (index($0, ver) > 0) { state=1 }
              next
            }
            state>=1 && /^## / { exit }
            state==1 && /^### Release Notes/ { state=2; next }
            state==2 && /^### / { exit }
            state==2 && /^\[/ { exit }
            state==2 {
              if (match($0, /^#+ /)) {
                n = RLENGTH - 1
                if (n >= 2) {
                  $0 = substr("##########", 1, n - 2) " " substr($0, RLENGTH + 1)
                }
              }
              print
            }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No ### Release Notes found under $GITHUB_REF_NAME in CHANGELOG.md -- refusing to build or release" >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "**Unsigned build**: this installer is not code-signed, so Windows SmartScreen will warn when you run it. Click \"More info\" > \"Run anyway\" to proceed."
          } >> release-notes.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set package version from tag
        shell: bash
        working-directory: app
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build and package
        working-directory: app
        run: npm run build:win

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            app/dist/*.exe
