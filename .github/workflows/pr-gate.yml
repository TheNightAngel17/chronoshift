name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-app-changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- app/; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    needs: detect-app-changes
    if: needs.detect-app-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build app
        run: npm run build

  gate:
    runs-on: ubuntu-latest
    needs:
      - detect-app-changes
      - test
    if: always()
    steps:
      - name: Enforce gate
        env:
          APP_CHANGED: ${{ needs.detect-app-changes.outputs.app_changed }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$APP_CHANGED" = "false" ]; then
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ]; then
            exit 0
          fi

          echo "App changes were detected and validation did not pass."
          exit 1
